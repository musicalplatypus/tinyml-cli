name: Release Build

on:
  push:
    tags: ['v*', 'PlatypusCLI_*']  # e.g. v0.9.0, PlatypusCLI_0.9.0_Release
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 0.9.0)'
        required: true

permissions:
  contents: write  # needed to create/upload release assets

jobs:
  # ---------------------------------------------------------------------------
  # Dataset mirror healthcheck (10-CONTEXT.md D-01) — confirms the release
  # carrying the nine downloadable dataset zips is reachable and correctly
  # tagged, before any binary is built. This is a reachability check only: it
  # downloads no payload. CI's own checkout holds only
  # generic_audio_classification.zip (.gitignore ignores the other nine), so an
  # artifact-level dataset assertion here would pass vacuously; verifying the
  # release's own asset metadata (name + size, via `gh release view --json`) is
  # what actually catches the realistic failure — a deleted or mis-tagged
  # release (e.g. a typo'd tag or a forgotten --latest=false) — without paying
  # for ~131 MB of downloads per run. Byte-level content verification is a
  # separate, deliberately heavier gate: scripts/verify_dataset_digests.py, run
  # at release-preflight time (see docs/RELEASING.md), not here.
  # ---------------------------------------------------------------------------
  mirror-healthcheck:
    runs-on: ubuntu-latest
    name: Dataset mirror healthcheck

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install mmcli (lightweight — PyYAML + tqdm only, no training engine)
        run: pip install -e .

      - name: Verify the mirror release is reachable and correctly tagged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import sys

          from mmcli.datasets import (
              DATASET_REGISTRY,
              DATASETS_DEFAULT_VERSION,
              DATASETS_MIRROR_TAG_PREFIX,
          )

          REPO = "musicalplatypus/tinyml-cli"
          tag = f"{DATASETS_MIRROR_TAG_PREFIX}{DATASETS_DEFAULT_VERSION}"
          expected = sorted(
              entry["filename"] for entry in DATASET_REGISTRY.values() if entry.get("ti_name")
          )

          result = subprocess.run(
              [
                  "gh", "release", "view", tag,
                  "--repo", REPO,
                  "--json", "tagName,assets",
              ],
              capture_output=True, text=True,
          )
          if result.returncode != 0:
              print(
                  f"FATAL: mirror release '{tag}' not reachable via `gh release view` "
                  f"(missing release, or a mis-tagged/forgotten --latest=false publish?): "
                  f"{result.stderr.strip()}",
                  file=sys.stderr,
              )
              sys.exit(1)

          data = json.loads(result.stdout)
          if data.get("tagName") != tag:
              print(
                  f"FATAL: gh reported tagName {data.get('tagName')!r}, expected {tag!r} — "
                  f"the mirror release appears mis-tagged",
                  file=sys.stderr,
              )
              sys.exit(1)

          assets = {a["name"]: a.get("size", 0) for a in data.get("assets", [])}
          missing = [name for name in expected if name not in assets]
          if missing:
              print(
                  f"FATAL: mirror release '{tag}' is missing expected asset(s): {missing}",
                  file=sys.stderr,
              )
              sys.exit(1)

          zero_size = [name for name in expected if assets[name] <= 0]
          if zero_size:
              print(
                  f"FATAL: mirror release '{tag}' has zero-byte asset(s): {zero_size}",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(f"OK: mirror release '{tag}' has all {len(expected)} expected assets, all non-zero size (no payload downloaded).")
          for name in expected:
              print(f"  {name}: {assets[name]} bytes")
          PY

  # ---------------------------------------------------------------------------
  # Run tests first — fail fast before building
  # ---------------------------------------------------------------------------
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: Test (${{ matrix.os }})
    continue-on-error: ${{ matrix.os == 'windows-latest' }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Checkout tinyml-tensorlab
        uses: actions/checkout@v4
        with:
          repository: musicalplatypus/tinyml-tensorlab
          ref: platypus_dev_1.4
          path: tinyml-tensorlab

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e tinyml-tensorlab/tinyml-modelzoo
          pip install -e tinyml-tensorlab/tinyml-tinyverse
          pip install -e "tinyml-tensorlab/tinyml-modeloptimization/torchmodelopt"
          pip install -e tinyml-tensorlab/tinyml-modelmaker --no-deps
          pip install defusedxml==0.7.1 "numpy==2.2.6" "PyYAML==6.0.3" "tqdm==4.67.1" "requests==2.32.5" "torch==2.7.1"
          pip install -e .
          pip install pytest

      - name: Run tests
        run: |
          python -m pytest \
            tests/test_cli_integration.py \
            tests/test_tier4_cli.py \
            tests/test_build_config.py \
            tests/test_datasets_download.py \
            tests/test_datasets_cli.py \
            tests/test_ci_workflows.py \
            -v --tb=short -k "not TestInitDatasetExtractReal"

  # ---------------------------------------------------------------------------
  # Build binaries (after tests pass)
  # ---------------------------------------------------------------------------
  build:
    needs: [test, mirror-healthcheck]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: mmcli-linux-x86_64
            binary: dist/mmcli
          - os: windows-latest
            artifact: mmcli-windows-x86_64
            binary: dist/mmcli.exe
          - os: macos-latest
            artifact: mmcli-macos-arm64
            binary: dist/mmcli
    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.os }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install mmcli + PyInstaller
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install .
          pip install pyinstaller

      - name: Build binary (Linux)
        if: runner.os == 'Linux'
        run: bash build_linux.sh

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File build_windows.ps1

      - name: Build binary (macOS)
        if: runner.os == 'macOS'
        run: bash build_macos.sh

      - name: Verify binary
        run: ${{ matrix.binary }} --version
        shell: bash

      - name: Gate — binary size ceiling
        # Reads scripts/binary_size_ceiling.txt at runtime; the ceiling is never a
        # literal in this file (F-1: a number repeated in the workflow, the test and
        # the build script is a number that will disagree with itself). `wc -c` is
        # used for the byte count rather than `stat -f%z`/`stat -c%s` because those
        # flags are BSD-only / GNU-only respectively and this step runs identically
        # on all three runners, including Windows' Git Bash.
        shell: bash
        run: |
          BINARY="${{ matrix.binary }}"
          SIZE=$(wc -c < "$BINARY")
          CEILING=$(cat scripts/binary_size_ceiling.txt)
          echo "binary_size_ceiling.txt: ${CEILING} bytes"
          echo "measured artifact size:  ${SIZE} bytes"
          if [ "$SIZE" -gt "$CEILING" ]; then
            echo "FAIL: ${BINARY} is ${SIZE} bytes, exceeding the ${CEILING}-byte ceiling in scripts/binary_size_ceiling.txt (REQ-SIZE-01)"
            exit 1
          fi
          echo "OK: ${BINARY} (${SIZE} bytes) is within the ${CEILING}-byte ceiling"

      - name: Gate — bundled dataset payload is non-empty
        # The runtime check that 10-03's staged --add-data allowlist actually landed
        # inside this platform's binary. PyInstaller accepts a wrong --add-data
        # separator (e.g. the POSIX "src:dst" form on Windows) without complaint,
        # producing a binary with an empty bundle and a successful build; `--version`
        # above still passes on such a binary, so only a runtime probe of the actual
        # bundled dataset catches it before it reaches a user's `init --dataset`.
        shell: bash
        run: "${{ matrix.binary }} datasets path generic_audio_classification"

      - name: Gate — startup regression (loose bound, catastrophic regressions only)
        # REQ-SIZE-01's 8s bound was measured on the maintainer's laptop (6.1-6.6s
        # actual); hosted runners are slower and load-variable, macOS worst of all.
        # 25s gives roughly 3x that laptop measurement's headroom, wide enough to
        # absorb normal runner variance while still catching a catastrophic
        # regression such as a re-bundled multi-hundred-MB training engine, which
        # would push real startup time far beyond this bound rather than merely
        # brushing against it. It will not notice a 6s -> 12s drift — that is a
        # deliberate trade explained in 10-CONTEXT.md D-02, not an oversight.
        shell: bash
        run: |
          STARTUP_CEILING_SECONDS=25
          SECONDS=0
          "${{ matrix.binary }}" --version > /dev/null
          ELAPSED=$SECONDS
          echo "startup: ${ELAPSED}s (ceiling: ${STARTUP_CEILING_SECONDS}s)"
          if [ "$ELAPSED" -gt "$STARTUP_CEILING_SECONDS" ]; then
            echo "FAIL: startup took ${ELAPSED}s, exceeding the ${STARTUP_CEILING_SECONDS}s regression-gate bound"
            exit 1
          fi
          echo "OK: startup ${ELAPSED}s within ${STARTUP_CEILING_SECONDS}s"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}

  # ---------------------------------------------------------------------------
  # Create GitHub Release with binaries attached
  # ---------------------------------------------------------------------------
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    name: Create Release

    steps:
      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: mmcli-linux-x86_64
          path: artifacts/linux

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: mmcli-windows-x86_64
          path: artifacts/windows

      - name: Download macOS binary
        uses: actions/download-artifact@v4
        with:
          name: mmcli-macos-arm64
          path: artifacts/macos

      - name: Rename binaries with version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          mkdir -p release
          cp artifacts/linux/mmcli "release/mmcli-${TAG}-linux-x86_64"
          cp artifacts/windows/mmcli.exe "release/mmcli-${TAG}-windows-x86_64.exe"
          cp artifacts/macos/mmcli "release/mmcli-${TAG}-macos-arm64"
          chmod +x "release/mmcli-${TAG}-linux-x86_64" "release/mmcli-${TAG}-macos-arm64"
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
