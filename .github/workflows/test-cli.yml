name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # manual trigger

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: Tests (${{ matrix.os }})
    continue-on-error: ${{ matrix.os == 'windows-latest' }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout tinyml-cli
        uses: actions/checkout@v4

      # tinyml-tensorlab carries committed Sphinx build output under docs/_build and docs/build
      # (951 tracked files). Some exceed Windows' 260-character MAX_PATH, e.g.
      #   docs/_build/html/_static/img/feature_extraction/
      #     pca_on_feature_extracted_train_data_MotorFault_256Input_FFTBIN_16Feature_8Frame_3InputChannel_removeDC_2D1.png
      # so `actions/checkout` fails with "Filename too long" and every later step is skipped.
      #
      # This is a workaround, not the fix. Those files originate UPSTREAM in
      # TexasInstruments/tinyml-tensorlab (commit 8c3ee09, Feb 2026, and others) -- they are not
      # ours to delete, and removing them from the fork would diverge it from upstream. Enabling
      # long paths is the only lever available on our side.
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout tinyml-tensorlab (dependency)
        uses: actions/checkout@v4
        with:
          repository: musicalplatypus/tinyml-tensorlab
          ref: integration
          path: tinyml-tensorlab

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install tinyml-tensorlab packages
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e tinyml-tensorlab/tinyml-modelzoo
          pip install -e tinyml-tensorlab/tinyml-tinyverse
          pip install -e "tinyml-tensorlab/tinyml-modeloptimization/torchmodelopt"
          pip install -e tinyml-tensorlab/tinyml-modelmaker --no-deps
          pip install defusedxml==0.7.1 "numpy==2.2.6" "PyYAML==6.0.3" "tqdm==4.67.1" "requests==2.32.5" "torch==2.7.1"

      - name: Install tinyml-cli
        run: |
          # `.[dev]`, not `.` — tests/test_fuzz_*.py import hypothesis, which is declared in
          # pyproject.toml's [project.optional-dependencies] dev group. `pip install -e .` does
          # not pull extras, so those two modules failed to IMPORT and pytest aborted during
          # collection: "2 errors during collection", 0 tests run. A collection error is not a
          # test failure -- it means the suite never reported on the code at all.
          pip install -e ".[dev]"

      - name: Run test suite
        # 10-REVIEW.md IN-06: collects the whole tests/ directory rather than a
        # hand-maintained list of six files -- a new test file lands in CI by
        # default, not by remembering to add it here and in release.yml.
        run: |
          python -m pytest tests/ -v --tb=short -k "not TestInitDatasetExtractReal"
