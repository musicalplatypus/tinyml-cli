[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mmcli"
version = "1.1.2"
description = "Command-line interface for tinyml-modelmaker training and compilation"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "tqdm>=4.0",
]

[project.scripts]
mmcli = "mmcli.cli:main"

[tool.setuptools]
# Must be false for the package-data allowlist below to mean anything. Setuptools defaults
# this to true for pyproject.toml projects, and with it on, package-data is ADDITIVE — every
# file sitting in the package directory is swept in regardless, so narrowing the glob alone
# left all ten datasets in the wheel and sdist (measured: 108.2 MB either way).
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["mmcli*"]

[tool.setuptools.package-data]
# An allowlist, not a filter. generic_audio_classification.zip is the one locally-authored
# dataset: it has no `ti_name`, so it has no mirror asset and cannot be fetched. The other
# nine are downloaded on demand by fetch_dataset() from the GitHub release mirror, exactly
# as they are for the binary — see BUNDLED_DATASETS in build_macos.sh / build_linux.sh /
# build_windows.ps1, which is the same decision on the PyInstaller side.
# Re-adding a wildcard here re-ships 125 MB of datasets in the wheel and sdist (REQ-SIZE-03).
#
# Measured on macOS 2026-07-31, building from a tree holding all ten zips:
#   wheel 108.22 MB -> 0.10 MB, sdist 108.26 MB -> 0.17 MB, installed package 608 KB.
# Three separate levers were needed and each was verified to matter on its own: this
# allowlist, include-package-data = false above (without it package-data is additive and
# nothing here binds), and MANIFEST.in (the sdist keeps its own file list). Narrowing only
# this line left both artifacts at 108 MB.
mmcli = ["example_datasets/generic_audio_classification.zip", "data/*.yaml"]

[tool.pytest.ini_options]
markers = [
    "cli: Tier 4 CLI integration tests",
    "e2e: Full end-to-end pipeline tests (slow, requires MMCLI_PYTHON + TVM)",
    "no_dataset_standins: opts a test class out of tests/test_datasets_download.py's stand-in dataset zip fixture (10-REVIEW.md WR-07)",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.0",
    "pytest>=7.0",
]
# `pytest-hypothesis` used to be listed here and does not exist on PyPI (404) -- installing
# `.[dev]` therefore failed outright. It went unnoticed because nothing ever installed the extras:
# CI ran a bare `pip install -e .`, so the fuzz tests' `hypothesis` import failed at COLLECTION and
# pytest aborted before running anything. Two defects hiding each other. The fuzz tests import only
# `hypothesis` and `pytest`; `pytest` is listed here so `.[dev]` is sufficient on its own.
