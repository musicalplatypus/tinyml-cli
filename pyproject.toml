[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mmcli"
version = "1.1.1"
description = "Command-line interface for tinyml-modelmaker training and compilation"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
mmcli = "mmcli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mmcli*"]

[tool.setuptools.package-data]
mmcli = ["example_datasets/*.zip", "data/*.yaml"]

[tool.pytest.ini_options]
markers = [
    "cli: Tier 4 CLI integration tests",
    "e2e: Full end-to-end pipeline tests (slow, requires MMCLI_PYTHON + TVM)",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.0",
    "pytest-hypothesis>=0.2.0",
]
