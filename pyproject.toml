[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mmcli"
version = "1.1.2"
description = "Command-line interface for tinyml-modelmaker training and compilation"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "tqdm>=4.0",
]

[project.scripts]
mmcli = "mmcli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mmcli*"]

[tool.setuptools.package-data]
# An allowlist, not a filter. generic_audio_classification.zip is the one locally-authored
# dataset: it has no `ti_name`, so it has no mirror asset and cannot be fetched. The other
# nine are downloaded on demand by fetch_dataset() from the GitHub release mirror, exactly
# as they are for the binary — see BUNDLED_DATASETS in build_macos.sh / build_linux.sh /
# build_windows.ps1, which is the same decision on the PyInstaller side.
# Re-adding a wildcard here re-ships 125 MB of datasets in the wheel and sdist (REQ-SIZE-03).
mmcli = ["example_datasets/generic_audio_classification.zip", "data/*.yaml"]

[tool.pytest.ini_options]
markers = [
    "cli: Tier 4 CLI integration tests",
    "e2e: Full end-to-end pipeline tests (slow, requires MMCLI_PYTHON + TVM)",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.0",
    "pytest-hypothesis>=0.2.0",
]
